<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Running figure -->
  <g>
    <!-- Head -->
    <circle cx="620" cy="280" r="70" fill="#1e5ba8"/>
    <!-- Body -->
    <path d="M 620 350 Q 620 450 620 550" stroke="#1e5ba8" stroke-width="60" fill="none" stroke-linecap="round"/>
    <!-- Left arm -->
    <path d="M 620 400 Q 500 380 420 300" stroke="#1e5ba8" stroke-width="50" fill="none" stroke-linecap="round"/>
    <!-- Right arm -->
    <path d="M 620 400 Q 740 350 800 280" stroke="#1e5ba8" stroke-width="50" fill="none" stroke-linecap="round"/>
    <!-- Left leg -->
    <path d="M 620 550 Q 550 620 480 700" stroke="#1e5ba8" stroke-width="50" fill="none" stroke-linecap="round"/>
    <!-- Right leg -->
    <path d="M 620 550 Q 690 610 760 690" stroke="#1e5ba8" stroke-width="50" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Orange squares pattern -->
  <g>
    <!-- First column -->
    <rect x="820" y="280" width="40" height="40" fill="#f4a942" rx="8"/>
    <!-- Second column -->
    <rect x="870" y="280" width="40" height="40" fill="#f4a942" rx="8"/>
    <rect x="870" y="330" width="40" height="40" fill="#f4a942" rx="8"/>
    <rect x="870" y="380" width="40" height="40" fill="#f4a942" rx="8"/>
    <!-- Third column -->
    <rect x="920" y="280" width="40" height="40" fill="#f4a942" rx="8"/>
    <rect x="920" y="330" width="40" height="40" fill="#f4a942" rx="8"/>
    <rect x="920" y="380" width="40" height="40" fill="#f4a942" rx="8"/>
  </g>
  
  <!-- Text "esporte" -->
  <text x="920" y="510" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#f4a942" letter-spacing="2">
    esporte
  </text>
</svg>
